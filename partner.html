<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoNow Merchant — Trung Tâm Quản Lý Nhà Hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --grn: #00b14f;
      --grn-dark: #008a3e;
      --bg: #f4f7f5;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }

    .topbar {
      background: linear-gradient(135deg, #009e47 0%, #007a37 100%);
      color: #fff; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 30;
      box-shadow: 0 4px 20px rgba(0, 138, 62, 0.22);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
    .brandIcon { width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 20px; }
    .backBtn {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px;
      background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25);
      padding: 8px 15px; border-radius: 999px; transition: 0.2s;
    }
    .backBtn:hover { background: rgba(255,255,255,0.28); }

    .wrap { max-width: 960px; margin: 24px auto; padding: 0 18px 80px; }

    .heroBanner {
      background: linear-gradient(125deg, #064e3b 0%, #008a3e 55%, #00b14f 100%);
      border-radius: 24px; padding: 28px 26px; color: #fff; margin-bottom: 20px;
      position: relative; overflow: hidden; box-shadow: 0 14px 34px rgba(0, 138, 62, 0.2);
    }
    .heroBanner::after { content: "🍜"; position: absolute; right: 22px; bottom: -10px; font-size: 96px; opacity: 0.16; pointer-events: none; }
    .heroPill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.18); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
    .heroBanner h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .heroBanner p { margin: 0; font-size: 14px; color: rgba(255,255,255,0.9); max-width: 580px; line-height: 1.55; }

    .card {
      background: var(--card); border-radius: 22px; padding: 22px 24px;
      box-shadow: var(--shadow); margin-bottom: 18px;
      border: 1px solid rgba(226, 232, 240, 0.85);
    }
    .title { margin: 0 0 4px; font-size: 19px; font-weight: 800; color: var(--ink); }
    .sub { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--line);
      border-radius: 13px; font-size: 14px; color: var(--ink); background: #f8fafc; transition: 0.2s; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--grn); background: #fff; box-shadow: 0 0 0 4px rgba(0, 177, 79, 0.12); }

    .fileBox { border: 1.5px dashed #cbd5e1; border-radius: 13px; padding: 10px 12px; background: #f8fafc; font-size: 13px; }
    .demoNotice {
      display: flex; align-items: flex-start; gap: 12px;
      background: linear-gradient(135deg, #ecfdf3 0%, #f0fdf4 100%);
      border: 1.5px solid #86efac; border-radius: 16px;
      padding: 14px 16px; margin: 18px 0; font-size: 13.5px; color: #166534; line-height: 1.5;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #00b14f 0%, #009640 100%);
      color: #fff; border: none; border-radius: 14px; padding: 11px 18px;
      font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 177, 79, 0.24);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover { transform: translateY(-1.5px); box-shadow: 0 10px 24px rgba(0, 177, 79, 0.32); }
    .btn.danger { background: #fff1f2; color: #be123c; border: 1.5px solid #fecdd3; box-shadow: none; }
    .btn.danger:hover { background: #ffe4e6; }
    .btn.ghost { background: #f1f5f9; color: #334155; box-shadow: none; }

    /* Shop Header & Stats */
    .shopHeroCard {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
      color: #fff; border-radius: 24px; padding: 22px 24px; margin-bottom: 18px;
      box-shadow: 0 14px 32px rgba(6, 78, 59, 0.2);
    }
    .shopAvatar {
      width: 56px; height: 56px; border-radius: 18px;
      background: rgba(255,255,255,0.18); backdrop-filter: blur(6px);
      display: grid; place-items: center; font-size: 28px; flex-shrink: 0;
    }
    .statGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .statBox { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; padding: 12px 14px; }
    .statVal { font-size: 19px; font-weight: 800; color: #fff; margin-top: 2px; }
    .statLbl { font-size: 11.5px; color: #d1fae5; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; }
    .tabBtn {
      padding: 11px 18px; border-radius: 14px; border: 1.5px solid var(--line);
      background: #fff; font-weight: 800; font-size: 14px; color: #475569;
      cursor: pointer; transition: 0.2s;
    }
    .tabBtn.active {
      background: var(--grn); border-color: var(--grn); color: #fff;
      box-shadow: 0 6px 16px rgba(0, 177, 79, 0.25);
    }

    /* Order & Food Grid */
    .ordBox { border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; background: #fff; }
    .foodGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .foodCard {
      border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden;
      background: #fff; display: flex; flex-direction: column; transition: 0.2s;
    }
    .foodCard:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); border-color: #a7f3d0; }
    .foodThumb { width: 100%; height: 150px; object-fit: cover; background: #f1f5f9; }
    .foodBody { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge.wait { background: #fef3c7; color: #b45309; }
    .badge.run { background: #dbeafe; color: #1d4ed8; }
    .badge.done { background: #dcfce7; color: #15803d; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 12px 22px; border-radius: 999px;
      font-size: 13.5px; font-weight: 700; z-index: 999; display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    @media (max-width: 600px) { .statGrid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brandIcon">🏪</div>
      <span>GoNow Merchant</span>
    </div>
    <a href="index.html" class="backBtn">← Trang khách hàng</a>
  </header>

  <main class="wrap" id="app"></main>
  <div class="toast" id="toast"></div>

  <script>
    const FOOD_STEPS = ['Chờ quán xác nhận', 'Quán đang chuẩn bị món', 'Tài xế đang lấy món', 'Đang giao đến khách', 'Hoàn thành'];
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => Number(n || 0).toLocaleString('vi-VN') + 'đ';
    let curTab = 'orders';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.style.display = 'none', 3200);
    }

    function getPartners() { try { return JSON.parse(localStorage.getItem('gonow_partners') || '[]'); } catch { return []; } }
    function savePartners(list) { localStorage.setItem('gonow_partners', JSON.stringify(list)); }
    function getActiveAccountKey() {
      return localStorage.getItem('gonow_active_account_key') || '';
    }
    function getCurrentPartner() {
      const uKey = getActiveAccountKey();
      const partners = getPartners();
      if (uKey) {
        const owned = partners.find(p => String(p.ownerUid) === uKey);
        if (owned) {
          localStorage.setItem('gonow_current_partner_id', owned.id);
          return owned;
        }
      }
      const id = localStorage.getItem('gonow_current_partner_id');
      return partners.find(p => p.id === id) || null;
    }
    function getOrders() { try { return JSON.parse(localStorage.getItem('gonow_orders') || '[]'); } catch { return []; } }
    function saveOrders(list) { localStorage.setItem('gonow_orders', JSON.stringify(list)); }
    function getPartnerFoods() { try { return JSON.parse(localStorage.getItem('gonow_partner_foods') || '[]'); } catch { return []; } }
    function savePartnerFoods(list) { localStorage.setItem('gonow_partner_foods', JSON.stringify(list)); }

    function render() {
      const shop = getCurrentPartner();
      const partners = getPartners();
      const app = document.getElementById('app');

      // MÀN HÌNH 1: ĐĂNG KÝ / CHỌN CỬA HÀNG
      if (!shop) {
        app.innerHTML = `
          <div class="heroBanner">
            <div class="heroPill">🍽️ MỞ GIAN HÀNG MIỄN PHÍ TRONG 5 GIÂY</div>
            <h1>Đưa quán ăn của bạn lên GoNow Food</h1>
            <p>Tự đăng tải thực đơn với hình ảnh hấp dẫn, tiếp cận hàng ngàn khách hàng quanh khu vực và quản lý đơn đặt món ngay lập tức.</p>
          </div>

          ${partners.length ? `
            <div class="card">
              <h2 class="title">🏪 Cửa hàng đã đăng ký</h2>
              <p class="sub">Chọn gian hàng của bạn để xem đơn khách đặt và quản lý thực đơn:</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;">
                ${partners.map(p => `
                  <button class="btn ghost" onclick="loginPartner('${p.id}')" style="justify-content:flex-start;border:1.5px solid #a7f3d0;background:#f0fdf4;color:#065f46;padding:12px 14px;">
                    <span style="font-size:24px;">🏪</span>
                    <div style="text-align:left;">
                      <div style="font-weight:800;font-size:14px;">${esc(p.storeName)}</div>
                      <div style="font-size:12px;color:#047857;">${esc(p.district)} • ${esc(p.mainCat)}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="card">
            <h2 class="title">📝 Đăng ký mở Cửa hàng mới</h2>
            <p class="sub">Điền thông tin quán để mở trang quản lý riêng và bắt đầu đăng món.</p>
            <form id="shopRegForm">
              <div class="grid2">
                <div>
                  <label>Tên cửa hàng / Nhà hàng *</label>
                  <input id="sName" required placeholder="VD: Bếp Nhà Mình - Cơm Tấm & Trà Sữa" />
                </div>
                <div>
                  <label>Họ tên chủ cửa hàng *</label>
                  <input id="sOwner" required placeholder="VD: Nguyễn Thị Lan" />
                </div>
                <div>
                  <label>Số điện thoại quán *</label>
                  <input id="sPhone" required placeholder="VD: 0908 111 222" />
                </div>
                <div>
                  <label>Khu vực hoạt động *</label>
                  <select id="sDistrict">
                    <option>Quận 1</option><option>Quận 3</option><option>Quận 5</option>
                    <option>Quận 7</option><option>Quận 10</option><option>Bình Thạnh</option>
                    <option>Phú Nhuận</option><option>Tân Bình</option><option>Thủ Đức</option>
                  </select>
                </div>
                <div>
                  <label>Danh mục ẩm thực chính *</label>
                  <select id="sCat">
                    <option>Cơm</option><option>Món nước</option><option>Đồ uống</option>
                    <option>Ăn vặt</option><option>Pizza & Burger</option><option>Tráng miệng</option><option>Món chay</option>
                  </select>
                </div>
                <div>
                  <label>Giấy phép kinh doanh / VSATTP (Tùy chọn)</label>
                  <div class="fileBox"><input type="file" accept="image/*,.pdf" style="border:none;padding:0;background:transparent;" /></div>
                </div>
              </div>

              <div class="demoNotice">
                <span style="font-size:20px;">✅</span>
                <div>
                  <b>Chế độ Demo tự động duyệt:</b> Toàn bộ giấy phép kinh doanh, CCCD chủ quán và chứng nhận VSATTP được <b>hệ thống đồng ý chấp thuận tự động 100%</b> ngay khi bấm mở quán!
                </div>
              </div>

              <button type="submit" class="btn" style="width:100%;padding:14px;font-size:15px;">
                🚀 Đồng ý & Mở gian hàng ngay
              </button>
            </form>
          </div>
        `;

        document.getElementById('shopRegForm').onsubmit = (e) => {
          e.preventDefault();
          const uKey = getActiveAccountKey();
          const newShop = {
            id: 'SHOP-' + Date.now().toString().slice(-6),
            ownerUid: uKey,
            storeId: Math.floor(100 + Math.random() * 899),
            storeName: document.getElementById('sName').value.trim(),
            owner: document.getElementById('sOwner').value.trim(),
            phone: document.getElementById('sPhone').value.trim(),
            district: document.getElementById('sDistrict').value,
            mainCat: document.getElementById('sCat').value
          };
          const list = getPartners().filter(p => !uKey || String(p.ownerUid) !== uKey);
          list.unshift(newShop);
          savePartners(list);
          localStorage.setItem('gonow_current_partner_id', newShop.id);
          showToast('🎉 Bản Demo: Cửa hàng đã được duyệt & gắn vĩnh viễn vào tài khoản của bạn!');
          render();
        };
        return;
      }

      // MÀN HÌNH 2: DASHBOARD RIÊNG CỦA NHÀ HÀNG
      const myFoods = getPartnerFoods().filter(f => f.partnerId === shop.id);
      const myFoodIds = new Set(myFoods.map(f => String(f.id)));
      const allFoodOrders = getOrders().filter(o => o && o.type === 'food');
      const shopOrders = allFoodOrders.filter(o =>
        String(o.storeId) === String(shop.storeId) ||
        (o.storeName && o.storeName === shop.storeName) ||
        (Array.isArray(o.items) && o.items.some(it => myFoodIds.has(String(it.id))))
      );
      const shopRevenue = shopOrders.filter(o => !o.cancelled).reduce((s, o) => s + Number(o.total || 0), 0);

      app.innerHTML = `
        <div class="shopHeroCard">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div class="shopAvatar">🏪</div>
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span style="font-size:20px;font-weight:800;">${esc(shop.storeName)}</span>
                  <span style="background:rgba(255,255,255,0.2);color:#fff;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;">✓ Đang mở cửa</span>
                </div>
                <div style="font-size:13px;color:#d1fae5;margin-top:4px;">
                  Chủ quán: ${esc(shop.owner)} • Khu vực: ${esc(shop.district)} • SĐT: ${esc(shop.phone)}
                </div>
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn ghost" onclick="render()" style="background:rgba(255,255,255,0.16);color:#fff;">↻ Làm mới</button>
              <button class="btn danger" onclick="logoutPartner()">Đổi cửa hàng</button>
            </div>
          </div>

          <div class="statGrid">
            <div class="statBox">
              <div class="statLbl">Tổng doanh thu đơn hàng</div>
              <div class="statVal">${money(shopRevenue)}</div>
            </div>
            <div class="statBox">
              <div class="statLbl">Đơn khách đã đặt</div>
              <div class="statVal">${shopOrders.length} đơn</div>
            </div>
            <div class="statBox">
              <div class="statLbl">Sản phẩm đang bán</div>
              <div class="statVal">${myFoods.length} món</div>
            </div>
          </div>
        </div>

        <div class="tabs">
          <button class="tabBtn ${curTab === 'orders' ? 'active' : ''}" onclick="switchTab('orders')">
            📦 Đơn khách đặt (${shopOrders.length})
          </button>
          <button class="tabBtn ${curTab === 'menu' ? 'active' : ''}" onclick="switchTab('menu')">
            🍽️ Thực đơn & Thêm món (${myFoods.length})
          </button>
        </div>

        ${curTab === 'orders' ? `
          <div class="card">
            <h3 class="title">📦 Đơn đặt món tại ${esc(shop.storeName)}</h3>
            <p class="sub">Khi khách đặt sản phẩm của quán bạn trên trang chủ, đơn sẽ hiển thị tại đây để bạn xác nhận.</p>

            ${shopOrders.length ? shopOrders.map(o => {
              const st = Number(o.status || 0);
              const isCancel = !!o.cancelled;
              const isDone = !isCancel && st >= 4;
              const itemsTxt = Array.isArray(o.items)
                ? o.items.map(i => `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>• <b>${esc(i.name)}</b> × ${i.qty} ${i.note ? `<i style="color:var(--muted);">(${esc(i.note)})</i>` : ''}</span><b>${money(i.price * i.qty)}</b></div>`).join('')
                : (Array.isArray(o.detail) ? o.detail.map(d => `<div>${esc(d)}</div>`).join('') : '');
              const nextBtn = st === 0 ? '✅ Nhận đơn & Chuẩn bị món' : (st === 1 ? '🛵 Bàn giao tài xế' : (st === 2 ? '🚚 Đang giao đến khách' : '🎉 Hoàn tất đơn'));

              return `
                <div class="ordBox">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <div>
                      <b style="font-size:15.5px;">Đơn hàng #${esc(o.id)}</b>
                      <span style="font-size:12px;color:var(--muted);"> • ${esc(o.createdAt || '')}</span>
                    </div>
                    <span class="badge ${isCancel ? 'wait' : (isDone ? 'done' : 'run')}" style="${isCancel ? 'background:#fee2e2;color:#b91c1c;' : ''}">
                      ${isCancel ? 'Đã hủy' : (FOOD_STEPS[st] || 'Đang xử lý')}
                    </span>
                  </div>

                  <div style="background:#f8fafc;padding:12px 14px;border-radius:14px;font-size:13.5px;margin-bottom:12px;border:1px solid #f1f5f9;">
                    ${itemsTxt}
                    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1;font-size:12.5px;color:#475569;">
                      👤 Khách đặt: <b>${esc(o.customer || 'Khách hàng')}</b> • SĐT: <b>${esc(o.phone || '')}</b><br/>
                      📍 Giao đến: ${esc(o.address || '')}
                    </div>
                  </div>

                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                    <div>Tổng tiền đơn: <strong style="color:var(--grn-dark);font-size:17px;">${money(o.total)}</strong></div>
                    ${!isCancel && !isDone ? `
                      <div style="display:flex;gap:8px;">
                        ${st <= 1 ? `<button class="btn danger" onclick="cancelFoodOrder('${esc(o.id)}')">✕ Từ chối</button>` : ''}
                        <button class="btn" onclick="advanceFoodOrder('${esc(o.id)}')">${nextBtn}</button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('') : `
              <div style="text-align:center;padding:36px 16px;background:#f8fafc;border-radius:16px;border:1.5px dashed var(--line);">
                <div style="font-size:38px;margin-bottom:8px;">🛍️</div>
                <div style="font-weight:800;font-size:15px;margin-bottom:4px;">Chưa có đơn đặt món nào</div>
                <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Hãy thêm sản phẩm mới ở tab <b>Thực đơn & Thêm món</b> để khách hàng đặt mua nhé!</div>
                <button class="btn" onclick="switchTab('menu')">➕ Thêm sản phẩm ngay</button>
              </div>
            `}
          </div>
        ` : `
          <div class="card">
            <h3 class="title">➕ Đăng sản phẩm mới lên GoNow</h3>
            <p class="sub">Sản phẩm vừa thêm sẽ xuất hiện ngay lập tức trên trang chủ để khách hàng đặt mua.</p>
            <form id="addFoodForm">
              <div class="grid2">
                <div>
                  <label>Tên món ăn / đồ uống *</label>
                  <input id="fName" required placeholder="VD: Cơm tấm sườn bì chả đặc biệt" />
                </div>
                <div>
                  <label>Danh mục món *</label>
                  <select id="fCat">
                    <option ${shop.mainCat === 'Cơm' ? 'selected' : ''}>Cơm</option>
                    <option ${shop.mainCat === 'Món nước' ? 'selected' : ''}>Món nước</option>
                    <option ${shop.mainCat === 'Đồ uống' ? 'selected' : ''}>Đồ uống</option>
                    <option ${shop.mainCat === 'Ăn vặt' ? 'selected' : ''}>Ăn vặt</option>
                    <option ${shop.mainCat === 'Pizza & Burger' ? 'selected' : ''}>Pizza & Burger</option>
                    <option ${shop.mainCat === 'Tráng miệng' ? 'selected' : ''}>Tráng miệng</option>
                    <option ${shop.mainCat === 'Món chay' ? 'selected' : ''}>Món chay</option>
                  </select>
                </div>
                <div>
                  <label>Giá bán (VNĐ) *</label>
                  <input id="fPrice" type="number" min="5000" step="1000" required placeholder="VD: 45000" />
                </div>
                <div>
                  <label>Link hình ảnh món ăn (Tùy chọn)</label>
                  <input id="fImg" placeholder="https://... (để trống dùng ảnh món ngon mặc định)" />
                </div>
              </div>
              <div style="margin-top:12px;">
                <label>Mô tả hấp dẫn cho khách hàng</label>
                <textarea id="fDesc" rows="2" placeholder="VD: Sườn nướng mật ong thơm mềm, kèm chả trứng và nước mắm chua ngọt..."></textarea>
              </div>
              <button type="submit" class="btn" style="margin-top:14px;">➕ Đăng bán sản phẩm lên trang chủ</button>
            </form>
          </div>

          <div class="card">
            <h3 class="title">📋 Thực đơn đang bán của ${esc(shop.storeName)} (${myFoods.length})</h3>
            <p class="sub">Toàn bộ món bên dưới đã được đồng bộ lên trang chủ GoNow.</p>
            ${myFoods.length ? `
              <div class="foodGrid">
                ${myFoods.map(f => `
                  <div class="foodCard">
                    <img class="foodThumb" src="${esc(f.img)}" alt="${esc(f.name)}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80'" />
                    <div class="foodBody">
                      <div>
                        <span class="badge done" style="margin-bottom:6px;">${esc(f.cat)}</span>
                        <div style="font-weight:800;font-size:15.5px;margin-bottom:4px;">${esc(f.name)}</div>
                        <div style="font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:10px;">${esc(f.desc || '')}</div>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #f1f5f9;">
                        <strong style="color:var(--grn-dark);font-size:16px;">${money(f.price)}</strong>
                        <button class="btn danger" style="padding:7px 12px;font-size:12.5px;" onclick="deletePartnerFood(${f.id})">Xóa món</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `<p style="color:var(--muted);font-size:13.5px;margin:0;">Quán chưa có sản phẩm nào. Hãy dùng biểu mẫu phía trên để thêm món đầu tiên!</p>`}
          </div>
        `}
      `;

      const addForm = document.getElementById('addFoodForm');
      if (addForm) {
        addForm.onsubmit = (e) => {
          e.preventDefault();
          const newItem = {
            id: Number(String(Date.now()).slice(-7)),
            name: document.getElementById('fName').value.trim(),
            cat: document.getElementById('fCat').value,
            price: Math.max(1000, Number(document.getElementById('fPrice').value)),
            desc: document.getElementById('fDesc').value.trim() || `Món ngon đặc trưng từ ${shop.storeName}`,
            img: document.getElementById('fImg').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80',
            rating: 5.0,
            partnerId: shop.id,
            storeId: shop.storeId,
            shop: shop.storeName
          };
          const list = getPartnerFoods();
          list.unshift(newItem);
          savePartnerFoods(list);
          showToast(`✅ Đã đăng "${newItem.name}" lên trang chủ GoNow!`);
          render();
        };
      }
    }

    window.switchTab = (t) => { curTab = t; render(); };
    window.loginPartner = (id) => { localStorage.setItem('gonow_current_partner_id', id); render(); };
    window.logoutPartner = () => { localStorage.removeItem('gonow_current_partner_id'); render(); };
    window.deletePartnerFood = (foodId) => {
      savePartnerFoods(getPartnerFoods().filter(f => Number(f.id) !== Number(foodId)));
      showToast('Đã xóa món khỏi thực đơn.');
      render();
    };
    window.advanceFoodOrder = (orderId) => {
      const list = getOrders();
      const o = list.find(x => String(x.id) === String(orderId));
      if (!o) return;
      o.status = Math.min(4, Number(o.status || 0) + 1);
      o.upd = Date.now();
      saveOrders(list);
      showToast('Đã cập nhật trạng thái đơn hàng cho khách!');
      render();
    };
    window.cancelFoodOrder = (orderId) => {
      const list = getOrders();
      const o = list.find(x => String(x.id) === String(orderId));
      if (!o) return;
      o.cancelled = true;
      o.upd = Date.now();
      saveOrders(list);
      showToast('Đã từ chối đơn hàng.');
      render();
    };

    window.addEventListener('storage', (e) => { if (e.key === 'gonow_orders') render(); });
    render();
  </script>
</body>
</html>
