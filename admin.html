<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoNow Admin – Quản trị cửa hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<!-- [AI] Trang quản trị GoNow. Dùng chung dữ liệu LocalStorage với index.html (cùng trình duyệt, cùng địa chỉ).
     Cấu trúc: #gate (đăng nhập) → #app (thanh bên + nội dung) → #panelWrap (ngăn kéo sửa) → #dialogWrap (hộp xác nhận). -->

<!-- ============ CỔNG ĐĂNG NHẬP ============ -->
<div id="gate">
  <div class="gateArt">
    <div class="brand">Go<span>Now</span><em>Admin</em></div>
    <div>
      <h2>Quản trị<br>cửa hàng GoNow</h2>
      <p>Theo dõi doanh thu, xử lý đơn hàng và cập nhật thực đơn tại một nơi.</p>
    </div>
    <small>© GoNow 2026 – dự án học tập</small>
  </div>
  <form class="gateForm" id="gateForm" autocomplete="off" novalidate>
    <h1>Đăng nhập quản trị</h1>
    <div class="gTabs" id="gTabs" hidden>
      <button type="button" class="on" data-act="gTab" data-id="code">Mã quản trị</button>
      <button type="button" data-act="gTab" data-id="fb">Tài khoản Firebase</button>
    </div>
    <label class="field" id="gEmailRow">Email quản trị<input class="in" id="gEmail" type="text" inputmode="email" autocapitalize="off" placeholder="admin@gonow.vn"></label>
    <label class="field" id="gPassRow">Mật khẩu<input class="in" id="gPass" type="password"></label>
    <label class="field" id="gCodeRow">Mã quản trị<input class="in" id="gCode" type="password" placeholder="Nhập mã trong config.js"></label>
    <p class="msg" id="gMsg" role="alert"></p>
    <button class="btn brand block" type="submit">Vào trang quản trị</button>
    <noscript><p class="msg">Trang này cần bật JavaScript.</p></noscript>
    <p class="hint" id="gNote"></p>
    <a class="hint link" href="index.html">← Về cửa hàng</a>
  </form>
</div>

<!-- ============ ỨNG DỤNG ============ -->
<div id="app" hidden>
  <aside class="side">
    <div class="brand">Go<span>Now</span><em>Admin</em></div>
    <nav id="nav" aria-label="Điều hướng quản trị"></nav>
    <div class="sideFoot">
      <a href="index.html" target="_blank" rel="noopener">Xem cửa hàng ↗</a>
      <div class="who" id="who"></div>
      <button class="sideBtn" data-act="logout">Đăng xuất</button>
    </div>
  </aside>
  <main class="main">
    <header class="pageHead">
      <div><p class="crumb" id="crumb"></p><h1 id="pageTitle"></h1></div>
      <div id="headActions"></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<!-- Ngăn kéo bên phải: chi tiết đơn, sửa sản phẩm, mã giảm giá, chỉnh giá hàng loạt -->
<div id="panelWrap" hidden><aside id="panel" role="dialog"></aside></div>
<!-- Hộp xác nhận -->
<div id="dialogWrap" hidden><div id="dialog" role="alertdialog"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
