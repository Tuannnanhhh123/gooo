<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoNow Driver — Trung Tâm Đối Tác Tài Xế</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --grn: #00b14f;
      --grn-dark: #008a3e;
      --grn-soft: #ecfdf3;
      --bg: #f4f7f5;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }

    /* Top Navigation */
    .topbar {
      background: linear-gradient(135deg, #009e47 0%, #007a37 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0, 138, 62, 0.22);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
    .brandIcon { width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 20px; }
    .backBtn {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px;
      background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25);
      padding: 8px 15px; border-radius: 999px; transition: 0.2s;
    }
    .backBtn:hover { background: rgba(255,255,255,0.28); }

    .wrap { max-width: 920px; margin: 24px auto; padding: 0 18px 80px; }

    /* Hero Banner cho trang Đăng ký */
    .heroBanner {
      background: linear-gradient(125deg, #064e3b 0%, #008a3e 55%, #00b14f 100%);
      border-radius: 24px;
      padding: 28px 26px;
      color: #fff;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0, 138, 62, 0.2);
    }
    .heroBanner::after {
      content: "🛵";
      position: absolute;
      right: 22px;
      bottom: -10px;
      font-size: 96px;
      opacity: 0.16;
      pointer-events: none;
    }
    .heroPill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.18); padding: 5px 12px;
      border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    }
    .heroBanner h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .heroBanner p { margin: 0; font-size: 14px; color: rgba(255,255,255,0.9); max-width: 560px; line-height: 1.55; }

    /* Card & Form */
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      border: 1px solid rgba(226, 232, 240, 0.85);
    }
    .title { margin: 0 0 4px; font-size: 19px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
    .sub { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--line);
      border-radius: 13px; font-size: 14px; color: var(--ink); background: #f8fafc; transition: 0.2s; outline: none;
    }
    input:focus, select:focus { border-color: var(--grn); background: #fff; box-shadow: 0 0 0 4px rgba(0, 177, 79, 0.12); }

    .fileBox {
      border: 1.5px dashed #cbd5e1; border-radius: 13px; padding: 10px 12px;
      background: #f8fafc; font-size: 13px; color: var(--muted);
    }
    .demoNotice {
      display: flex; align-items: flex-start; gap: 12px;
      background: linear-gradient(135deg, #ecfdf3 0%, #f0fdf4 100%);
      border: 1.5px solid #86efac; border-radius: 16px;
      padding: 14px 16px; margin: 18px 0; font-size: 13.5px; color: #166534; line-height: 1.5;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #00b14f 0%, #009640 100%);
      color: #fff; border: none; border-radius: 14px; padding: 12px 20px;
      font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 177, 79, 0.24);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover { transform: translateY(-1.5px); box-shadow: 0 10px 24px rgba(0, 177, 79, 0.32); }
    .btn:active { transform: scale(0.98); }
    .btn.danger { background: #fff1f2; color: #be123c; border: 1.5px solid #fecdd3; box-shadow: none; }
    .btn.danger:hover { background: #ffe4e6; }
    .btn.ghost { background: #f1f5f9; color: #334155; box-shadow: none; }
    .btn.ghost:hover { background: #e2e8f0; }

    /* Driver Dashboard Header & Stats */
    .drvProfileCard {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff; border-radius: 24px; padding: 22px 24px; margin-bottom: 18px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
    }
    .drvAvatar {
      width: 54px; height: 54px; border-radius: 18px;
      background: linear-gradient(135deg, #00b14f, #34d399);
      display: grid; place-items: center; font-size: 26px; font-weight: 800; flex-shrink: 0;
    }
    .statGrid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px;
    }
    .statBox {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 12px 14px;
    }
    .statVal { font-size: 19px; font-weight: 800; color: #4ade80; margin-top: 2px; }
    .statLbl { font-size: 11.5px; color: #cbd5e1; font-weight: 600; }

    /* Ride Request Cards */
    .rideItem {
      border: 1.5px solid var(--line); border-radius: 18px; padding: 18px;
      margin-bottom: 14px; background: #fff; transition: 0.2s;
    }
    .rideItem:hover { border-color: #a7f3d0; box-shadow: 0 8px 24px rgba(0, 177, 79, 0.08); }
    .rideItem.active { border-color: var(--grn); background: linear-gradient(180deg, #ffffff 0%, #f4fdf8 100%); }

    .timelineRoute {
      position: relative; padding-left: 22px; margin: 12px 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .timelineRoute::before {
      content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px;
      width: 2px; background: dashed #cbd5e1; border-left: 2px dashed #94a3b8;
    }
    .ptRow { position: relative; font-size: 13.5px; font-weight: 600; color: #1e293b; }
    .ptDot {
      position: absolute; left: -21px; top: 4px; width: 11px; height: 11px;
      border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 2px currentColor;
    }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge.wait { background: #fef3c7; color: #b45309; }
    .badge.run { background: #dbeafe; color: #1d4ed8; }
    .badge.done { background: #dcfce7; color: #15803d; }

    .pulseDot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 12px 22px; border-radius: 999px;
      font-size: 13.5px; font-weight: 700; z-index: 999; display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    @media (max-width: 600px) {
      .statGrid { grid-template-columns: 1fr; }
      .heroBanner h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brandIcon">🛵</div>
      <span>GoNow Driver</span>
    </div>
    <a href="index.html" class="backBtn">← Trang khách hàng</a>
  </header>

  <main class="wrap" id="app"></main>
  <div class="toast" id="toast"></div>

  <script>
    const STEPS = ['Đang chờ tài xế nhận', 'Đã nhận chuyến', 'Đang đến điểm đón', 'Đang chở khách', 'Hoàn thành'];
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => Number(n || 0).toLocaleString('vi-VN') + 'đ';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.style.display = 'none', 3200);
    }

    function getDrivers() { try { return JSON.parse(localStorage.getItem('gonow_drivers') || '[]'); } catch { return []; } }
    function saveDrivers(list) { localStorage.setItem('gonow_drivers', JSON.stringify(list)); }
    function getActiveAccountKey() {
      return localStorage.getItem('gonow_active_account_key') || '';
    }
    function getCurrentDriver() {
      const uKey = getActiveAccountKey();
      const drivers = getDrivers();
      if (uKey) {
        const owned = drivers.find(d => String(d.ownerUid) === uKey);
        if (owned) {
          localStorage.setItem('gonow_current_driver_id', owned.id);
          return owned;
        }
      }
      const id = localStorage.getItem('gonow_current_driver_id');
      return drivers.find(d => d.id === id) || null;
    }
    function getOrders() { try { return JSON.parse(localStorage.getItem('gonow_orders') || '[]'); } catch { return []; } }
    function saveOrders(list) { localStorage.setItem('gonow_orders', JSON.stringify(list)); }

    function splitRoute(r) {
      const raw = (Array.isArray(r.detail) && r.detail[0]) ? r.detail[0] : `${r.from || 'Điểm đón khách'} → ${r.to || 'Điểm trả khách'}`;
      const parts = raw.split('→');
      return {
        from: (parts[0] || r.from || 'Điểm đón khách').trim(),
        to: (parts[1] || r.to || 'Điểm trả khách').trim()
      };
    }

    function render() {
      const drv = getCurrentDriver();
      const drivers = getDrivers();
      const app = document.getElementById('app');

      // MÀN HÌNH 1: ĐĂNG KÝ / CHỌN TÀI XẾ
      if (!drv) {
        app.innerHTML = `
          <div class="heroBanner">
            <div class="heroPill">⚡ KÍCH HOẠT TÀI KHOẢN TRONG 5 GIÂY</div>
            <h1>Trở thành Đối tác Tài xế GoNow</h1>
            <p>Tự do làm chủ thời gian, nhận cuốc xe trực tiếp theo thời gian thực và theo dõi thu nhập minh bạch ngay trên điện thoại.</p>
          </div>

          ${drivers.length ? `
            <div class="card">
              <h2 class="title">👨‍✈️ Hồ sơ tài xế đã kích hoạt</h2>
              <p class="sub">Bấm vào tài khoản của bạn để mở bảng điều phối cuốc xe:</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;">
                ${drivers.map(d => `
                  <button class="btn ghost" onclick="loginDriver('${d.id}')" style="justify-content:flex-start;border:1.5px solid #a7f3d0;background:#f0fdf4;color:#065f46;padding:12px 14px;">
                    <span style="font-size:22px;">${d.vehicleType === 'bike' ? '🛵' : '🚗'}</span>
                    <div style="text-align:left;">
                      <div style="font-weight:800;font-size:14px;">${esc(d.name)}</div>
                      <div style="font-size:12px;color:#047857;">${esc(d.plate)}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="card">
            <h2 class="title">📝 Đăng ký hồ sơ Tài xế mới</h2>
            <p class="sub">Điền thông tin cơ bản của bạn và phương tiện để bắt đầu nhận chuyến.</p>
            <form id="drvRegForm">
              <div class="grid2">
                <div>
                  <label>Họ và tên tài xế *</label>
                  <input id="dName" required placeholder="VD: Trần Minh Tuấn" />
                </div>
                <div>
                  <label>Số điện thoại liên hệ *</label>
                  <input id="dPhone" required placeholder="VD: 0909 123 456" />
                </div>
                <div>
                  <label>Loại phương tiện *</label>
                  <select id="dType">
                    <option value="bike">🛵 Xe máy (GoBike)</option>
                    <option value="car4">🚗 Ô tô 4 chỗ (GoCar)</option>
                    <option value="car7">🚙 Ô tô 7 chỗ (GoCar XL)</option>
                  </select>
                </div>
                <div>
                  <label>Biển số xe & Dòng xe *</label>
                  <input id="dPlate" required placeholder="VD: 59-X1 678.90 • Honda Wave" />
                </div>
                <div>
                  <label>Ảnh CCCD / Bằng lái xe (Tùy chọn)</label>
                  <div class="fileBox"><input type="file" accept="image/*" style="border:none;padding:0;background:transparent;" /></div>
                </div>
                <div>
                  <label>Giấy đăng ký xe / Bảo hiểm (Tùy chọn)</label>
                  <div class="fileBox"><input type="file" accept="image/*" style="border:none;padding:0;background:transparent;" /></div>
                </div>
              </div>

              <div class="demoNotice">
                <span style="font-size:20px;">✅</span>
                <div>
                  <b>Chế độ Demo tự động duyệt:</b> Toàn bộ giấy tờ CCCD, Bằng lái xe và Cavet xe của bạn được <b>hệ thống đồng ý chấp thuận tự động 100%</b> ngay sau khi bấm hoàn tất!
                </div>
              </div>

              <button type="submit" class="btn" style="width:100%;padding:14px;font-size:15px;">
                🚀 Hoàn tất & Vào bảng nhận cuốc xe
              </button>
            </form>
          </div>
        `;

        document.getElementById('drvRegForm').onsubmit = (e) => {
          e.preventDefault();
          const uKey = getActiveAccountKey();
          const newDrv = {
            id: 'DRV-' + Date.now().toString().slice(-6),
            ownerUid: uKey,
            name: document.getElementById('dName').value.trim(),
            phone: document.getElementById('dPhone').value.trim(),
            vehicleType: document.getElementById('dType').value,
            plate: document.getElementById('dPlate').value.trim(),
            online: true
          };
          const list = getDrivers().filter(d => !uKey || String(d.ownerUid) !== uKey);
          list.unshift(newDrv);
          saveDrivers(list);
          localStorage.setItem('gonow_current_driver_id', newDrv.id);
          showToast('🎉 Bản Demo: Hồ sơ đã được duyệt & lưu vĩnh viễn vào tài khoản của bạn!');
          render();
        };
        return;
      }

      // MÀN HÌNH 2: DASHBOARD RIÊNG CỦA TÀI XẾ
      const orders = getOrders().filter(o => o && o.type === 'ride');
      const ignored = drv.ignoredIds || [];
      const myActiveRides = orders.filter(o => !o.cancelled && o.status >= 1 && o.status < 4 && o.driver && o.driver.id === drv.id);
      const incomingRides = orders.filter(o => !o.cancelled && Number(o.status || 0) === 0 && !ignored.includes(o.id));
      const myDoneRides = orders.filter(o => !o.cancelled && o.status >= 4 && o.driver && o.driver.id === drv.id);
      const totalEarned = myDoneRides.reduce((s, r) => s + Number(r.total || 0), 0);

      app.innerHTML = `
        <div class="drvProfileCard">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div class="drvAvatar">${drv.vehicleType === 'bike' ? '🛵' : '🚖'}</div>
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span style="font-size:19px;font-weight:800;">${esc(drv.name)}</span>
                  <span style="background:rgba(34,197,94,0.2);color:#4ade80;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
                    <span class="pulseDot"></span> Đang trực tuyến
                  </span>
                </div>
                <div style="font-size:13px;color:#cbd5e1;margin-top:4px;">
                  ${esc(drv.plate)} • SĐT: ${esc(drv.phone)}
                </div>
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn ghost" onclick="render()" style="background:rgba(255,255,255,0.12);color:#fff;">↻ Làm mới</button>
              <button class="btn danger" onclick="logoutDriver()">Đổi tài khoản</button>
            </div>
          </div>

          <div class="statGrid">
            <div class="statBox">
              <div class="statLbl">Doanh thu hoàn thành</div>
              <div class="statVal">${money(totalEarned)}</div>
            </div>
            <div class="statBox">
              <div class="statLbl">Chuyến đã hoàn tất</div>
              <div class="statVal" style="color:#fff;">${myDoneRides.length} chuyến</div>
            </div>
            <div class="statBox">
              <div class="statLbl">Khách đang chờ nhận</div>
              <div class="statVal" style="color:#fbbf24;">${incomingRides.length} yêu cầu</div>
            </div>
          </div>
        </div>

        ${myActiveRides.length ? `
          <div class="card">
            <h3 class="title">🚀 Cuốc xe đang thực hiện (${myActiveRides.length})</h3>
            <p class="sub">Bấm nút cập nhật bên dưới để thông báo tiến trình trực tiếp lên bản đồ của khách hàng.</p>
            ${myActiveRides.map(r => {
              const st = Number(r.status || 1);
              const nextLabel = st === 1 ? '📍 Xác nhận đã tới điểm đón' : (st === 2 ? '🛵 Đã đón khách — Bắt đầu chạy' : '🎉 Hoàn thành chuyến đi');
              const pt = splitRoute(r);
              return `
                <div class="rideItem active">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                    <span style="font-weight:800;font-size:15px;">Chuyến #${esc(r.id)}</span>
                    <span class="badge run">${STEPS[st] || 'Đang chạy'}</span>
                  </div>
                  <div class="timelineRoute">
                    <div class="ptRow"><span class="ptDot" style="color:#2563eb;background:#2563eb;"></span>Điểm đón: ${esc(pt.from)}</div>
                    <div class="ptRow"><span class="ptDot" style="color:#ef4444;background:#ef4444;"></span>Điểm đến: ${esc(pt.to)}</div>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px dashed var(--line);">
                    <div style="font-size:13.5px;">
                      👤 <b>${esc(r.customer || 'Khách đặt xe')}</b> • Thu khách: <strong style="color:var(--grn-dark);font-size:16px;">${money(r.total)}</strong>
                    </div>
                    <div style="display:flex;gap:8px;">
                      <button class="btn" onclick="advanceRide('${esc(r.id)}')">${nextLabel}</button>
                      <button class="btn danger" onclick="releaseRide('${esc(r.id)}')">Hủy chuyến</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <h3 class="title">🔔 Yêu cầu đặt xe mới (${incomingRides.length})</h3>
            <span class="badge wait">Tự động cập nhật</span>
          </div>
          <p class="sub">Khách hàng vừa đặt xe sẽ hiển thị ngay tại đây. Bạn có quyền nhận hoặc bỏ qua.</p>

          ${incomingRides.length ? incomingRides.map(r => {
            const pt = splitRoute(r);
            const svc = Array.isArray(r.detail) && r.detail[1] ? r.detail[1] : (r.service || 'Dịch vụ GoNow');
            return `
              <div class="rideItem">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                  <div>
                    <span style="font-weight:800;font-size:15.5px;color:var(--ink);">${esc(svc)}</span>
                    <span style="font-size:12px;color:var(--muted);"> • #${esc(r.id)} • ${esc(r.createdAt || '')}</span>
                  </div>
                  <strong style="font-size:17px;font-weight:800;color:var(--grn-dark);">${money(r.total)}</strong>
                </div>

                <div class="timelineRoute">
                  <div class="ptRow"><span class="ptDot" style="color:#2563eb;background:#2563eb;"></span>Đón tại: ${esc(pt.from)}</div>
                  <div class="ptRow"><span class="ptDot" style="color:#ef4444;background:#ef4444;"></span>Trả tại: ${esc(pt.to)}</div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px solid #f1f5f9;">
                  <span style="font-size:13px;color:var(--muted);">👤 Khách: <b style="color:var(--ink);">${esc(r.customer || 'Khách vãng lai')}</b></span>
                  <div style="display:flex;gap:8px;">
                    <button class="btn danger" onclick="rejectRide('${esc(r.id)}')">✕ Bỏ qua</button>
                    <button class="btn" onclick="acceptRide('${esc(r.id)}')">✅ Nhận chuyến ngay</button>
                  </div>
                </div>
              </div>
            `;
          }).join('') : `
            <div style="text-align:center;padding:36px 16px;background:#f8fafc;border-radius:16px;border:1.5px dashed var(--line);">
              <div style="font-size:38px;margin-bottom:8px;">📡</div>
              <div style="font-weight:800;font-size:15px;margin-bottom:4px;">Đang quét yêu cầu đặt xe quanh khu vực...</div>
              <div style="font-size:13px;color:var(--muted);">Khi có khách đặt xe bên trang chủ, cuốc xe sẽ nổ chuông hiển thị tại đây ngay lập tức.</div>
            </div>
          `}
        </div>

        <div class="card">
          <h3 class="title" style="font-size:16px;">🧾 Lịch sử cuốc xe đã hoàn thành (${myDoneRides.length})</h3>
          ${myDoneRides.length ? myDoneRides.map(r => {
            const pt = splitRoute(r);
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px;gap:10px;">
                <div>
                  <b>#${esc(r.id)}</b> • ${esc(pt.from)} → ${esc(pt.to)}
                  <div style="font-size:12px;color:var(--muted);">${esc(r.createdAt || '')}</div>
                </div>
                <strong style="color:var(--grn-dark);white-space:nowrap;">+${money(r.total)}</strong>
              </div>
            `;
          }).join('') : `<p style="font-size:13px;color:var(--muted);margin:8px 0 0;">Chưa có chuyến xe nào hoàn thành.</p>`}
        </div>
      `;
    }

    window.loginDriver = (id) => { localStorage.setItem('gonow_current_driver_id', id); render(); };
    window.logoutDriver = () => { localStorage.removeItem('gonow_current_driver_id'); render(); };
    window.acceptRide = (orderId) => {
      const drv = getCurrentDriver();
      if (!drv) return;
      const list = getOrders();
      const o = list.find(x => String(x.id) === String(orderId));
      if (!o || o.status !== 0) { showToast('Chuyến này đã có tài xế khác nhận hoặc bị hủy!'); return render(); }
      o.status = 1;
      o.upd = Date.now();
      o.driver = { id: drv.id, name: drv.name, phone: drv.phone, plate: drv.plate, model: drv.plate, rating: 5.0, trips: 120, years: 2 };
      saveOrders(list);
      showToast('✅ Đã nhận chuyến! Vị trí của bạn đã hiển thị bên khách hàng.');
      render();
    };
    window.rejectRide = (orderId) => {
      const drv = getCurrentDriver();
      if (!drv) return;
      const drivers = getDrivers();
      const me = drivers.find(d => d.id === drv.id);
      if (me) { me.ignoredIds = [...(me.ignoredIds || []), orderId]; saveDrivers(drivers); }
      showToast('Đã bỏ qua chuyến xe này.');
      render();
    };
    window.advanceRide = (orderId) => {
      const list = getOrders();
      const o = list.find(x => String(x.id) === String(orderId));
      if (!o) return;
      o.status = Math.min(4, Number(o.status || 1) + 1);
      o.upd = Date.now();
      saveOrders(list);
      showToast(o.status === 4 ? '🎉 Hoàn thành chuyến đi! Doanh thu đã được cộng.' : 'Đã cập nhật tiến độ cho khách hàng!');
      render();
    };
    window.releaseRide = (orderId) => {
      const list = getOrders();
      const o = list.find(x => String(x.id) === String(orderId));
      if (!o) return;
      o.status = 0;
      delete o.driver;
      o.upd = Date.now();
      saveOrders(list);
      showToast('Đã trả chuyến về hàng chờ.');
      render();
    };

    window.addEventListener('storage', (e) => { if (e.key === 'gonow_orders') render(); });
    render();
  </script>
  <script>
(function listenExpressDriverBroadcast() {
  const _esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shownIds = new Set();

  function showDriverRequestBanner(order) {
    if (!order || !order.id || shownIds.has(order.id)) return;
    shownIds.add(order.id);

    const old = document.getElementById('gnDriverExpressAlert');
    if (old) old.remove();

    const banner = document.createElement('div');
    banner.id = 'gnDriverExpressAlert';
    banner.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.65);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;';
    banner.innerHTML = `
      <div style="background:#fff;width:100%;max-width:440px;border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);border:2px solid #00b14f;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="background:#dcfce7;color:#166534;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;">🔔 CUỐC GIAO HÀNG MỚI</span>
          <strong style="font-size:18px;color:#008a3e;">${Number(order.total || 0).toLocaleString('vi-VN')}đ</strong>
        </div>
        <h3 style="margin:0 0 10px;font-size:17px;color:#0f172a;">${_esc(order.serviceName || 'GoNow Express')} • #${_esc(order.id)}</h3>

        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.55;margin-bottom:14px;">
          <div style="margin-bottom:8px;"><b style="color:#2563eb;">🔵 Điểm nhận hàng:</b><br>${_esc(order.from)}</div>
          <div><b style="color:#ef4444;">🔴 Điểm giao hàng:</b><br>${_esc(order.to)}</div>
        </div>

        ${order.packagePhoto ? `
          <div style="margin-bottom:14px;text-align:center;">
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:4px;">Ảnh kiện hàng khách chụp:</div>
            <img src="${order.packagePhoto}" style="max-height:120px;border-radius:10px;border:1px solid #cbd5e1;" alt="Ảnh đơn hàng">
          </div>
        ` : ''}

        <div style="display:flex;gap:10px;">
          <button type="button" id="drvRejectExp" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;">Bỏ qua</button>
          <button type="button" id="drvAcceptExp" style="flex:1.5;padding:12px;border-radius:12px;border:none;background:#00b14f;color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;">✅ Nhận cuốc ngay</button>
        </div>
      </div>
    `;
    document.body.appendChild(banner);

    banner.querySelector('#drvRejectExp').onclick = () => banner.remove();
    banner.querySelector('#drvAcceptExp').onclick = () => {
      // Cập nhật trạng thái đã nhận cuốc vào kho đơn hàng chung
      ['gonow_orders', 'gn_orders', 'orders', 'gn_driver_requests'].forEach(key => {
        try {
          const list = JSON.parse(localStorage.getItem(key) || '[]');
          const found = list.find(x => x && x.id === order.id);
          if (found) {
            found.status = 1;
            found.statusText = 'Tài xế đã nhận đơn & đang đến lấy hàng';
            found.acceptedBy = 'Tài xế GoNow';
            localStorage.setItem(key, JSON.stringify(list));
          }
        } catch {}
      });
      banner.remove();
      alert(`Bạn đã nhận cuốc #${order.id} thành công! Vui lòng di chuyển tới điểm nhận hàng.`);
      if (typeof renderDriverOrders === 'function') renderDriverOrders();
    };
  }

  // 1. Lắng nghe realtime qua BroadcastChannel
  try {
    const bc = new BroadcastChannel('gonow_driver_channel');
    bc.onmessage = (e) => {
      if (e.data && e.data.type === 'NEW_EXPRESS_ORDER') {
        showDriverRequestBanner(e.data.order);
      }
    };
  } catch {}

  // 2. Lắng nghe qua localStorage khi mở nhiều tab hoặc tải lại trang
  function checkPendingDriverQueue() {
    try {
      const queue = JSON.parse(localStorage.getItem('gn_driver_requests') || '[]');
      const newest = queue.find(q => q && !q.acceptedBy && !q.cancelled && Number(q.status || 0) === 0);
      if (newest) showDriverRequestBanner(newest);
    } catch {}
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'gn_driver_requests') checkPendingDriverQueue();
  });
  setTimeout(checkPendingDriverQueue, 600);
})();
</script>
</body>
